name: Patch FlutterFlow Fonts

on:
  push:
    branches:
      - flutterflow

permissions:
  contents: write

jobs:
  patch-fonts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Patch FlutterFlow theme fonts
        run: python3 .github/scripts/auto_patch_project.py

      - name: Commit patched files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Auto patch FlutterFlow fonts and project files" || echo "No changes to commit"
          git push
