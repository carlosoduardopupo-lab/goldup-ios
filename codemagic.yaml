workflows:
  ios_app_store:
    name: iOS App Store Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: GoldUpAdmin

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.goldup.app

    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..

      - name: Force iPhone-only build
        script: |
          PBXPROJ_PATH="ios/Runner.xcodeproj/project.pbxproj"
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2"/TARGETED_DEVICE_FAMILY = "1"/g' "$PBXPROJ_PATH"
          grep "TARGETED_DEVICE_FAMILY" "$PBXPROJ_PATH"

      - name: Build iOS (Flutter)
        script: |
          flutter build ios --release --no-codesign

      - name: Archive with Xcode (workspace + scheme)
        script: |
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            archive

      - name: Export IPA
        script: |
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist $CM_EXPORT_OPTIONS_PLIST \
            -exportPath build/ios/ipa

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
