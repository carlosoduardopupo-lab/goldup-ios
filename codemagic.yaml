workflows:
  ios_app_store:
    name: iOS App Store Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: GoldUpAdmin

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.goldup.app

    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install
          cd ..

      - name: Force iPhone-only build
        script: |
          PBXPROJ_PATH="ios/Runner.xcodeproj/project.pbxproj"
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2"/TARGETED_DEVICE_FAMILY = "1"/g' "$PBXPROJ_PATH"
          grep "TARGETED_DEVICE_FAMILY" "$PBXPROJ_PATH"

      - name: Set up code signing
        script: |
          xcode-project use-profiles --certificate "goldup_distribution_cert" --profile "goldup_appstore_profile"

      - name: Build IPA
        script: |
          flutter build ipa --release --flavor ios-production -t lib/main_prod.dart --export-options-plist=$CM_EXPORT_OPTIONS_PLIST

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
