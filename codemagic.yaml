workflows:
  ios_app_store:
    name: iOS App Store Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: GoldUpAdmin

    environment:
      flutter: 3.41.9
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.goldup.app

    scripts:
      - name: Patch FlutterFlow generated code
        script: |
          python3 .github/scripts/auto_patch_project.py

      - name: Install Flutter dependencies
        script: |
          flutter pub get

      - name: Clean and install CocoaPods
        script: |
          cd ios
          rm -rf Pods Podfile.lock
          pod install --repo-update
          cd ..

      - name: Force iPhone-only build safely
        script: |
          PBXPROJ_PATH="ios/Runner.xcodeproj/project.pbxproj"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("ios/Runner.xcodeproj/project.pbxproj")
          text = path.read_text()

          text = text.replace('TARGETED_DEVICE_FAMILY = "1,2";', 'TARGETED_DEVICE_FAMILY = "1";')
          text = text.replace('TARGETED_DEVICE_FAMILY = 1,2;', 'TARGETED_DEVICE_FAMILY = 1;')

          path.write_text(text)
          PY

          grep "TARGETED_DEVICE_FAMILY" "$PBXPROJ_PATH"
          xcodebuild -list -workspace ios/Runner.xcworkspace

      - name: Set up code signing
        script: |
          xcode-project use-profiles --project ios/Runner.xcodeproj

      - name: Build iOS and IPA
        script: |
          set -e
          flutter build ios --release --no-codesign --build-name=1.2.2 --build-number=21
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
